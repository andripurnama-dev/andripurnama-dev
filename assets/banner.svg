<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="AP Portfolio banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#39ff6a"/>
      <stop offset="1" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05080a"/>
      <stop offset="1" stop-color="#0a1410"/>
    </linearGradient>
    <clipPath id="sub"><rect x="300" y="168" width="0" height="26">
      <animate attributeName="width" values="0;470;470;0" keyTimes="0;0.4;0.9;1" dur="9s" repeatCount="indefinite"/>
    </rect></clipPath>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .r{font:13px monospace;fill:#39ff6a;opacity:.28;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:2px}
    </style>
  </defs>

  <rect width="900" height="280" fill="url(#bg)"/>

  <!-- binary rain -->
  <g>
    <text class="r" x="30" y="0">10110010110<animateTransform attributeName="transform" type="translate" values="0,-160;0,300" dur="7s" repeatCount="indefinite" begin="-2s"/></text>
    <text class="r" x="105" y="0">01001101001<animateTransform attributeName="transform" type="translate" values="0,-160;0,300" dur="9s" repeatCount="indefinite" begin="-5s"/></text>
    <text class="r" x="180" y="0">11010100110<animateTransform attributeName="transform" type="translate" values="0,-160;0,300" dur="6s" repeatCount="indefinite" begin="-1s"/></text>
    <text class="r" x="255" y="0">00101101011<animateTransform attributeName="transform" type="translate" values="0,-160;0,300" dur="8s" repeatCount="indefinite" begin="-6s"/></text>
    <text class="r" x="330" y="0">10011010010<animateTransform attributeName="transform" type="translate" values="0,-160;0,300" dur="10s" repeatCount="indefinite" begin="-3s"/></text>
    <text class="r" x="405" y="0">01101001101<animateTransform attributeName="transform" type="translate" values="0,-160;0,300" dur="7.5s" repeatCount="indefinite" begin="-4s"/></text>
    <text class="r" x="480" y="0">11001011001<animateTransform attributeName="transform" type="translate" values="0,-160;0,300" dur="9.5s" repeatCount="indefinite" begin="-7s"/></text>
    <text class="r" x="555" y="0">00110100101<animateTransform attributeName="transform" type="translate" values="0,-160;0,300" dur="6.5s" repeatCount="indefinite" begin="-2.5s"/></text>
    <text class="r" x="630" y="0">10100110110<animateTransform attributeName="transform" type="translate" values="0,-160;0,300" dur="8.5s" repeatCount="indefinite" begin="-1.5s"/></text>
    <text class="r" x="705" y="0">01011001011<animateTransform attributeName="transform" type="translate" values="0,-160;0,300" dur="7s" repeatCount="indefinite" begin="-5.5s"/></text>
    <text class="r" x="780" y="0">11100101001<animateTransform attributeName="transform" type="translate" values="0,-160;0,300" dur="9s" repeatCount="indefinite" begin="-3.5s"/></text>
    <text class="r" x="855" y="0">00101110100<animateTransform attributeName="transform" type="translate" values="0,-160;0,300" dur="6s" repeatCount="indefinite" begin="-0.5s"/></text>
  </g>

  <!-- soft vignette so text stays readable -->
  <rect x="0" y="60" width="900" height="160" fill="#05080a" opacity="0.55"/>

  <!-- emblem -->
  <g transform="translate(150,140)" filter="url(#glow)">
    <animateTransform attributeName="transform" type="translate" values="150,134;150,146;150,134" dur="4s" repeatCount="indefinite"/>
    <circle r="78" fill="none" stroke="#39ff6a" stroke-opacity=".25" stroke-dasharray="6 10">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle r="64" fill="none" stroke="#00e5ff" stroke-opacity=".25" stroke-dasharray="2 8">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
    </circle>
    <path d="M0,-52 L40,-34 L40,14 L0,52 L-40,14 L-40,-34 Z" fill="#07110c" stroke="url(#g)" stroke-width="3">
      <animate attributeName="stroke-opacity" values="1;.55;1" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-40 L30,-27 L30,10 L0,40 L-30,10 L-30,-27 Z" fill="none" stroke="#39ff6a" stroke-opacity=".35"/>
    <text x="0" y="12" text-anchor="middle" font-family="monospace" font-weight="700" font-size="34" fill="url(#g)">AP</text>
    <rect x="-18" y="-24" width="12" height="3" fill="#39ff6a"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></rect>
    <rect x="6" y="-24" width="12" height="3" fill="#39ff6a"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></rect>
  </g>

  <!-- title -->
  <text x="300" y="128" font-family="monospace" font-weight="700" font-size="44" fill="url(#g)" filter="url(#glow)">ANDRI PURNAMA</text>
  <text x="302" y="156" font-family="monospace" font-size="14" fill="#7fb894" letter-spacing="4"> </text>

  <!-- typed subtitle -->
  <g clip-path="url(#sub)">
    <text x="300" y="187" font-family="monospace" font-size="17" fill="#d6ffe4">IT Developer • TKJ Teacher • Technology Enthusiast</text>
  </g>
  <rect x="300" y="170" width="9" height="20" fill="#39ff6a">
    <animate attributeName="x" values="300;770;770;300" keyTimes="0;0.4;0.9;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- scan line -->
  <rect x="0" y="0" width="900" height="2" fill="#39ff6a" opacity=".12">
    <animate attributeName="y" values="0;280" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="1" y="1" width="898" height="278" fill="none" stroke="#39ff6a" stroke-opacity=".25"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
